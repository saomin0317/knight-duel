<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>武士圓舞曲 Knight's Waltz</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    .hpbar {
      position: fixed; top: 16px; width: 260px; height: 18px;
      background: #333; border: 2px solid #666; border-radius: 4px; overflow: hidden;
    }
    #hp-player { left: 16px; }
    #hp-enemy  { right: 16px; }
    .hpfill { height: 100%; width: 100%; transition: width .12s; }
    #hp-player .hpfill { background: #4a90d9; }
    #hp-enemy  .hpfill { background: #c0392b; }
    #stamina-player {
      position: fixed; top: 38px; left: 16px; width: 260px; height: 8px;
      background: #2a2a2a; border: 1px solid #555; border-radius: 3px; overflow: hidden;
    }
    #stamina-player .stfill { height: 100%; width: 100%; background: #e0c04a; transition: width .1s; }
    #stamina-player.exhausted .stfill { background: #d04030; }
    .hplabel { position: fixed; top: 38px; color: #aaa; font-size: 12px; }
    #label-player { left: 18px; }
    #label-enemy  { right: 18px; }
    #msg {
      position: fixed; top: 40%; left: 0; right: 0; text-align: center;
      color: #fff; font-size: 42px; font-weight: 700; text-shadow: 0 2px 8px #000;
      display: none; pointer-events: none;
    }
    #hint {
      position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
      color: #888; font-size: 13px; pointer-events: none;
    }
    #gold {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      color: #ffd766; font-size: 18px; font-weight: 700; text-shadow: 0 1px 4px #000;
    }
    #shop {
      position: fixed; top: 60px; right: 16px; width: 340px; max-height: calc(100vh - 120px);
      overflow-y: auto; background: rgba(20, 18, 14, 0.96); border: 2px solid #6b5a3e;
      border-radius: 8px; padding: 14px 16px; color: #ddd; display: none;
    }
    #shop.open { display: block; }
    #shop h2 { margin: 0 0 4px; font-size: 18px; color: #ffd766; }
    #shop h3 { margin: 12px 0 6px; font-size: 14px; color: #c8b48a; border-bottom: 1px solid #4a3f2c; padding-bottom: 3px; }
    .srow { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
    .thumb { width: 44px; height: 44px; background: #26221c; border-radius: 4px; flex-shrink: 0; }
    .sname { width: 70px; }
    .sstat { flex: 1; color: #999; font-size: 11px; }
    .srow button {
      width: 76px; padding: 3px 0; border-radius: 4px; border: 1px solid #866f47;
      background: #3a3020; color: #ffd766; cursor: pointer; font-size: 12px;
    }
    .srow button:hover { background: #4a3d28; }
    .srow button.eq { background: #2d4a2d; border-color: #5a8a5a; color: #aaffaa; cursor: default; }
    .srow button.cant { opacity: 0.45; cursor: default; }
    .shop-note { margin-top: 10px; font-size: 11px; color: #887; }
    /* 主畫面 */
    #menu { position: fixed; inset: 0; display: none; pointer-events: none; }
    #menu.open { display: block; }
    #menu-title {
      position: fixed; top: 36px; left: 50%; transform: translateX(-50%);
      font-size: 40px; color: #ffd766; font-weight: 800; text-shadow: 0 3px 12px #000;
    }
    #hero-label {
      position: fixed; left: 26%; transform: translateX(-50%); bottom: 190px;
      color: #bbb; font-size: 13px; text-shadow: 0 1px 4px #000; text-align: center;
    }
    #menu-bottom {
      position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: auto;
    }
    #btn-fight {
      font-size: 24px; padding: 12px 46px; background: #7a1f1f; color: #ffeedd;
      border: 2px solid #c0392b; border-radius: 8px; cursor: pointer; font-weight: 700;
    }
    #btn-fight:hover { background: #962525; }
    #opp-select { display: flex; gap: 10px; align-items: center; color: #ddd; font-size: 16px; }
    #opp-select button { width: 38px; height: 32px; background: #333; color: #ddd; border: 1px solid #666; border-radius: 6px; cursor: pointer; font-size: 15px; }
    #arena-select { color: #999; font-size: 13px; display: flex; gap: 6px; align-items: center; }
    #arena-select button { padding: 3px 12px; background: #2a2a30; color: #bbb; border: 1px solid #555; border-radius: 5px; cursor: pointer; }
    #arena-select button.cur { border-color: #ffd766; color: #ffd766; }
    /* 戰鬥中按鈕 */
    #battle-btns { position: fixed; bottom: 40px; right: 16px; display: flex; flex-direction: column; gap: 8px; }
    #battle-btns.hidden { display: none; }
    #battle-btns button {
      padding: 8px 18px; background: rgba(40,36,28,.92); color: #ddd;
      border: 1px solid #6b5a3e; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    #battle-btns button:hover { background: rgba(60,52,38,.95); }
    /* 開場畫面 */
    #titlescreen {
      position: fixed; inset: 0; z-index: 50;
      background: radial-gradient(ellipse at center, rgba(20,16,10,0.55) 0%, rgba(8,6,4,0.92) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    #ts-name {
      font-size: 72px; font-weight: 900; color: #ffd766;
      text-shadow: 0 4px 0 #7a5c1e, 0 8px 24px #000; letter-spacing: 4px;
    }
    #ts-sub { font-size: 18px; color: #c8b48a; letter-spacing: 8px; }
    #btn-start {
      margin-top: 26px; font-size: 26px; padding: 14px 64px;
      background: #7a1f1f; color: #ffeedd; border: 2px solid #c0392b;
      border-radius: 10px; cursor: pointer; font-weight: 700;
    }
    #btn-start:hover { background: #962525; }
    #ts-rating {
      position: fixed; bottom: 18px; display: flex; align-items: center; gap: 10px;
      left: 50%; transform: translateX(-50%);
    }
    #ts-rating .rtext { font-size: 11px; color: #998; line-height: 1.6; text-align: left; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hp-player" class="hpbar"><div class="hpfill"></div></div>
  <div id="hp-enemy"  class="hpbar"><div class="hpfill"></div></div>
  <div id="stamina-player"><div class="stfill"></div></div>
  <div id="label-player" class="hplabel" style="top: 50px;">你(藍)</div>
  <div id="label-enemy"  class="hplabel">敵人(紅)</div>
  <div id="msg"></div>
  <div id="gold">💰 0</div>
  <div id="shop">
    <h2>鐵匠鋪</h2>
    <div id="shop-items"></div>
    <div class="shop-note">按 B 開關|買到手後點「裝備」立刻換裝(重開本場)</div>
  </div>
  <div id="titlescreen">
    <div id="ts-name">⚔ 武士圓舞曲</div>
    <div id="ts-sub">Knight's Waltz・俯視角物理決鬥</div>
    <button id="btn-start">進入遊戲</button>
    <!-- 遊戲分級標章(遊戲軟體分級管理辦法:宣傳/使用頁面須標示) -->
    <div id="ts-rating">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-label="輔導十五歲級">
        <rect x="1" y="1" width="44" height="44" rx="8" fill="#e07b10" stroke="#fff" stroke-width="2"/>
        <text x="23" y="26" text-anchor="middle" fill="#fff" font-size="20" font-weight="800" font-family="sans-serif">15</text>
        <text x="23" y="39" text-anchor="middle" fill="#fff" font-size="9" font-family="sans-serif">輔導級</text>
      </svg>
      <div class="rtext">本遊戲為輔導十五歲級,未滿十五歲之人不得使用<br>部分內容涉及暴力、血腥情節|依遊戲軟體分級管理辦法標示</div>
    </div>
  </div>
  <div id="menu">
    <div id="menu-title">⚔ 武士圓舞曲</div>
    <div id="hero-label">◀ ▶ 或滑鼠拖曳旋轉人物<br>鐵匠鋪買的裝備會直接穿在身上</div>
    <div id="menu-bottom">
      <div id="opp-select"><button id="opp-prev">◀</button><span id="opp-label"></span><button id="opp-next">▶</button></div>
      <div id="arena-select">場地:
        <button data-shape="circle">圓</button><button data-shape="square">方</button>
        <button data-shape="hex">六角</button><button data-shape="oct">八角</button>
      </div>
      <button id="btn-fight">⚔ 開始戰鬥</button>
    </div>
  </div>
  <div id="battle-btns" class="hidden">
    <button id="btn-restart">重開 (R)</button>
    <button id="btn-shop2">鐵匠鋪 (B)</button>
    <button id="btn-menu">回主畫面</button>
  </div>
  <div id="hint">← → 旋轉甩劍|↑ ↓ 前後移動|轉太久會力竭,注意黃色體力條</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
