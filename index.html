<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#100d09" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>武士圓舞曲 Knight's Waltz</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; overscroll-behavior: none; }
    #app { position: fixed; inset: 0; }
    #app canvas { touch-action: none; }
    .hpbar {
      position: fixed; top: 16px; width: 260px; height: 18px;
      background: #333; border: 2px solid #666; border-radius: 4px; overflow: hidden;
    }
    #hp-player { left: 16px; }
    #hp-enemy  { right: 16px; }
    .hpfill { height: 100%; width: 100%; transition: width .12s; }
    #hp-player .hpfill { background: #4a90d9; }
    #hp-enemy  .hpfill { background: #c0392b; }
    #stamina-player {
      position: fixed; top: 38px; left: 16px; width: 260px; height: 8px;
      background: #2a2a2a; border: 1px solid #555; border-radius: 3px; overflow: hidden;
    }
    #stamina-player .stfill { height: 100%; width: 100%; background: #e0c04a; transition: width .1s; }
    #stamina-player.exhausted .stfill { background: #d04030; }
    .hplabel { position: fixed; top: 38px; color: #aaa; font-size: 12px; }
    #label-player { left: 18px; }
    #label-enemy  { right: 18px; }
    #msg {
      position: fixed; top: 40%; left: 0; right: 0; text-align: center;
      color: #fff; font-size: 42px; font-weight: 700; text-shadow: 0 2px 8px #000;
      display: none; pointer-events: none;
    }
    #hint {
      position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
      color: #888; font-size: 13px; pointer-events: none;
    }
    #gold {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      color: #ffd766; font-size: 18px; font-weight: 700; text-shadow: 0 1px 4px #000;
    }
    #btn-sound {
      position: fixed; top: 12px; left: 50%; transform: translateX(78px);
      width: 34px; height: 30px; font-size: 16px; z-index: 55;
      background: rgba(40,36,28,.85); border: 1px solid #6b5a3e; border-radius: 6px;
      color: #ddd; cursor: pointer;
    }
    #btn-sound.muted { opacity: 0.55; }
    #shop {
      position: fixed; top: 60px; right: 16px; width: 340px; max-height: calc(100vh - 120px);
      overflow-y: auto; background: rgba(20, 18, 14, 0.96); border: 2px solid #6b5a3e;
      border-radius: 8px; padding: 14px 16px; color: #ddd; display: none; z-index: 30;
    }
    #shop.open { display: block; }
    #shop h2 { margin: 0 0 4px; font-size: 18px; color: #ffd766; }
    #shop h3 { margin: 12px 0 6px; font-size: 14px; color: #c8b48a; border-bottom: 1px solid #4a3f2c; padding-bottom: 3px; }
    .srow { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
    .thumb { width: 44px; height: 44px; background: #26221c; border-radius: 4px; flex-shrink: 0; }
    .sname { width: 70px; }
    .sstat { flex: 1; color: #999; font-size: 11px; }
    .srow button {
      width: 76px; padding: 3px 0; border-radius: 4px; border: 1px solid #866f47;
      background: #3a3020; color: #ffd766; cursor: pointer; font-size: 12px;
    }
    .srow button:hover { background: #4a3d28; }
    .srow button.eq { background: #2d4a2d; border-color: #5a8a5a; color: #aaffaa; cursor: default; }
    .srow button.cant { opacity: 0.45; cursor: default; }
    .shop-note { margin-top: 10px; font-size: 11px; color: #887; }
    /* 主畫面 */
    #menu { position: fixed; inset: 0; display: none; pointer-events: none; }
    #menu.open { display: block; }
    #menu-title {
      position: fixed; top: 36px; left: 50%; transform: translateX(-50%);
      font-size: 40px; color: #ffd766; font-weight: 800; text-shadow: 0 3px 12px #000;
    }
    #hero-label {
      position: fixed; left: 26%; transform: translateX(-50%); bottom: 190px;
      color: #bbb; font-size: 13px; text-shadow: 0 1px 4px #000; text-align: center;
    }
    #menu-bottom {
      position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: auto;
    }
    #btn-fight {
      font-size: 24px; padding: 12px 46px; background: #7a1f1f; color: #ffeedd;
      border: 2px solid #c0392b; border-radius: 8px; cursor: pointer; font-weight: 700;
    }
    #btn-fight:hover { background: #962525; }
    #opp-select { display: flex; gap: 10px; align-items: center; color: #ddd; font-size: 16px; }
    #opp-select button { width: 38px; height: 32px; background: #333; color: #ddd; border: 1px solid #666; border-radius: 6px; cursor: pointer; font-size: 15px; }
    #arena-select { color: #999; font-size: 13px; display: flex; gap: 6px; align-items: center; }
    #arena-select button { padding: 3px 12px; background: #2a2a30; color: #bbb; border: 1px solid #555; border-radius: 5px; cursor: pointer; }
    #arena-select button.cur { border-color: #ffd766; color: #ffd766; }
    /* 帳號面板(主畫面左上) */
    #account {
      position: fixed; top: 88px; left: 16px; width: 210px;
      background: rgba(20,18,14,.92); border: 1px solid #4a3f2c; border-radius: 8px;
      padding: 12px; pointer-events: auto; color: #ddd; font-size: 13px;
    }
    #account h4 { margin: 0 0 8px; font-size: 13px; color: #c8b48a; }
    #account button {
      display: block; width: 100%; margin: 6px 0; padding: 7px 0;
      background: #2a2a30; color: #ddd; border: 1px solid #666; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    #account button:hover { background: #3a3a42; }
    #acc-name { color: #ffd766; font-weight: 700; margin-bottom: 4px; word-break: break-all; }
    #acc-stats { color: #aaa; margin-bottom: 6px; }
    #acc-err { color: #d66; font-size: 11px; min-height: 14px; margin-top: 4px; }
    /* 戰鬥中按鈕 */
    #battle-btns { position: fixed; bottom: 40px; right: 16px; display: flex; flex-direction: column; gap: 8px; }
    #battle-btns.hidden { display: none; }
    #battle-btns button {
      padding: 8px 18px; background: rgba(40,36,28,.92); color: #ddd;
      border: 1px solid #6b5a3e; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    #battle-btns button:hover { background: rgba(60,52,38,.95); }
    /* 觸控按鈕(僅觸控裝置顯示,由 JS 開) */
    #touch-controls { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 20; }
    .tc-pad { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 16px; pointer-events: auto; }
    .tc-l { left: max(16px, env(safe-area-inset-left)); }
    .tc-r { right: max(16px, env(safe-area-inset-right)); flex-direction: column; }
    #touch-controls button {
      width: 66px; height: 66px; border-radius: 50%; font-size: 26px;
      background: rgba(40,36,28,.5); color: #ffd766; border: 2px solid rgba(140,115,75,.6);
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    }
    #touch-controls button.on { background: rgba(150,55,37,.8); }
    #rotate-hint {
      display: none; position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.75); color: #ffd766; padding: 8px 18px; border-radius: 8px;
      font-size: 14px; z-index: 40; pointer-events: none;
    }
    @media (pointer: coarse) and (orientation: portrait) { #rotate-hint { display: block; } }
    /* 小螢幕版面 */
    @media (max-width: 700px) {
      .hpbar { width: 30vw; }
      #stamina-player { width: 30vw; }
      .hplabel { font-size: 10px; }
      #menu-title { font-size: 24px; top: 12px; }
      #ts-name { font-size: 42px; letter-spacing: 2px; }
      #ts-sub { font-size: 13px; letter-spacing: 4px; }
      #btn-start { font-size: 20px; padding: 11px 44px; }
      #ts-links { font-size: 12px; bottom: 74px; }
      #ts-rating .rtext { font-size: 9px; }
      #ts-rating img { height: 40px !important; }
      #shop { width: min(320px, 62vw); top: 48px; right: 6px; max-height: calc(100vh - 170px); z-index: 30; padding: 10px 12px; }
      .sname { width: 60px; font-size: 12px; }
      .thumb { width: 34px; height: 34px; }
      #account { width: 150px; font-size: 12px; top: 70px; left: 6px; padding: 8px 10px; }
      #hero-label { display: none; }
      #hint { display: none; }
      #btn-fight { font-size: 18px; padding: 10px 30px; }
      #menu-bottom { bottom: 100px; gap: 8px; }
      #opp-select { font-size: 13px; }
      #gold { font-size: 15px; }
    }
    /* 觸控裝置通用:戰鬥按鈕移右上讓出拇指區;藏鍵盤提示;聲音鈕移到金幣下方 */
    @media (pointer: coarse) {
      #battle-btns { bottom: auto; top: 56px; right: 8px; gap: 5px; }
      #battle-btns button { padding: 6px 12px; font-size: 12px; }
      #hint { display: none; }
      #hero-label { display: none; }
      #btn-sound { top: 46px; left: 50%; transform: translateX(-17px); }
    }
    /* 手機橫向(矮螢幕):整體壓縮 */
    @media (max-height: 520px) {
      #menu-title { font-size: 20px; top: 6px; }
      #ts-name { font-size: 40px; }
      #gold { font-size: 15px; top: 10px; }
      .hplabel { font-size: 10px; }
      #shop { top: 42px; width: 300px; max-height: calc(100vh - 58px); padding: 8px 12px; }
      #shop h2 { font-size: 14px; margin-bottom: 2px; }
      #shop h3 { margin: 6px 0 4px; font-size: 12px; }
      .srow { padding: 2px 0; font-size: 12px; }
      .thumb { width: 30px; height: 30px; }
      #account { top: 42px; width: 150px; padding: 6px 10px; font-size: 12px; }
      #account button { padding: 5px 0; margin: 4px 0; font-size: 12px; }
      #account h4 { margin: 0 0 4px; }
      #menu-bottom { bottom: 12px; gap: 6px; }
      #btn-fight { font-size: 17px; padding: 8px 28px; }
      #opp-select { font-size: 12px; }
      #ts-links { bottom: 64px; font-size: 12px; }
      #ts-rating img { height: 38px !important; }
      #ts-rating .rtext { font-size: 9px; line-height: 1.5; }
    }
    /* 手機直向:開場排版 */
    @media (max-width: 480px) {
      #ts-name { font-size: 32px; letter-spacing: 1px; white-space: nowrap; }
      #ts-sub { font-size: 12px; letter-spacing: 3px; white-space: nowrap; }
      #ts-links { bottom: 138px; }
      #ts-rating { width: 88vw; }
      #ts-rating .rtext { font-size: 9px; line-height: 1.5; }
    }
    /* 主畫面模式:戰鬥 HUD(血條/體力/標籤)全藏,右手前後鍵也不需要 */
    body.ui-menu .hpbar, body.ui-menu #stamina-player, body.ui-menu .hplabel { display: none; }
    body.ui-menu .tc-r { display: none; }
    /* 開場畫面 */
    #titlescreen {
      position: fixed; inset: 0; z-index: 50;
      background: radial-gradient(ellipse at center, rgba(20,16,10,0.55) 0%, rgba(8,6,4,0.92) 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    #ts-name {
      font-size: 72px; font-weight: 900; color: #ffd766;
      text-shadow: 0 4px 0 #7a5c1e, 0 8px 24px #000; letter-spacing: 4px;
    }
    #ts-sub { font-size: 18px; color: #c8b48a; letter-spacing: 8px; }
    #btn-start {
      margin-top: 26px; font-size: 26px; padding: 14px 64px;
      background: #7a1f1f; color: #ffeedd; border: 2px solid #c0392b;
      border-radius: 10px; cursor: pointer; font-weight: 700;
    }
    #btn-start:hover { background: #962525; }
    /* 載入畫面:蓋住模型下載的空窗(正式站要抓幾 MB) */
    #loading {
      position: fixed; inset: 0; z-index: 60; background: #100d09;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    #loading .ld-name { font-size: 34px; font-weight: 800; color: #ffd766; letter-spacing: 3px; }
    #loading .ld-text { font-size: 14px; color: #998; animation: ldpulse 1.2s ease-in-out infinite; }
    @keyframes ldpulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    #ts-links {
      position: fixed; bottom: 86px; left: 50%; transform: translateX(-50%);
      font-size: 13px; color: #776;
    }
    #ts-links a { color: #a99; text-decoration: none; margin: 0 8px; }
    #ts-links a:hover { color: #ffd766; }
    #ts-rating {
      position: fixed; bottom: 18px; display: flex; align-items: center; gap: 10px;
      left: 50%; transform: translateX(-50%);
    }
    #ts-rating .rtext { font-size: 11px; color: #998; line-height: 1.6; text-align: left; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hp-player" class="hpbar"><div class="hpfill"></div></div>
  <div id="hp-enemy"  class="hpbar"><div class="hpfill"></div></div>
  <div id="stamina-player"><div class="stfill"></div></div>
  <div id="label-player" class="hplabel" style="top: 50px;">你(藍)</div>
  <div id="label-enemy"  class="hplabel">敵人(紅)</div>
  <div id="msg"></div>
  <div id="gold">💰 0</div>
  <button id="btn-sound" title="聲音開關">🔊</button>
  <div id="shop">
    <h2>鐵匠鋪</h2>
    <div id="shop-items"></div>
    <div class="shop-note">按 B 開關|買到手後點「裝備」立刻換裝(重開本場)</div>
  </div>
  <div id="loading">
    <div class="ld-name">⚔ 武士圓舞曲</div>
    <div class="ld-text">載入中…</div>
  </div>
  <div id="titlescreen">
    <div id="ts-name">⚔ 武士圓舞曲</div>
    <div id="ts-sub">Knight's Waltz・俯視角物理決鬥</div>
    <button id="btn-start">進入遊戲</button>
    <div id="ts-links">
      <a href="about.html" target="_blank" rel="noopener">關於本遊戲</a>|<a href="terms.html" target="_blank" rel="noopener">服務條款</a>|<a href="privacy.html" target="_blank" rel="noopener">隱私權政策</a>
    </div>
    <!-- 遊戲分級標章(官方標準圖,遊戲軟體分級管理辦法:宣傳/使用頁面須標示) -->
    <div id="ts-rating">
      <img src="rating_15.png" alt="輔導十五歲級" style="height:52px">
      <div class="rtext">本遊戲為輔導十五歲級,未滿十五歲之人不得使用<br>部分內容涉及暴力、血腥情節|依遊戲軟體分級管理辦法標示</div>
    </div>
  </div>
  <script>
    // 開場畫面只在本分頁第一次出現——這裡就要判斷,不能等遊戲載完才藏
    // (正式站模型下載要幾秒,晚藏的話每次 reload 都會閃出開場畫面)
    if (sessionStorage.getItem('kd_title_seen')) document.getElementById('titlescreen').style.display = 'none';
  </script>
  <div id="menu">
    <div id="menu-title">⚔ 武士圓舞曲</div>
    <div id="hero-label">◀ ▶ 或滑鼠拖曳旋轉人物<br>鐵匠鋪買的裝備會直接穿在身上</div>
    <div id="account">
      <h4>帳號</h4>
      <div id="acc-out">
        <button id="btn-google">Google 登入</button>
        <button id="btn-apple"> Apple 登入</button>
        <button id="btn-anon">訪客遊玩</button>
      </div>
      <div id="acc-in" style="display:none">
        <div id="acc-name"></div>
        <div id="acc-stats"></div>
        <button id="btn-logout">登出</button>
      </div>
      <div id="acc-err"></div>
    </div>
    <div id="menu-bottom">
      <div id="opp-select"><button id="opp-prev">◀</button><span id="opp-label"></span><button id="opp-next">▶</button></div>
      <button id="btn-fight">⚔ 開始戰鬥</button>
    </div>
  </div>
  <div id="battle-btns" class="hidden">
    <button id="btn-restart">重開 (R)</button>
    <button id="btn-shop2">鐵匠鋪 (B)</button>
    <button id="btn-menu">回主畫面</button>
  </div>
  <div id="touch-controls">
    <div class="tc-pad tc-l"><button id="tc-left">◀</button><button id="tc-right">▶</button></div>
    <div class="tc-pad tc-r"><button id="tc-up">▲</button><button id="tc-down">▼</button></div>
  </div>
  <div id="rotate-hint">📱 轉成橫向比較好打</div>
  <div id="hint">← → 旋轉甩劍|↑ ↓ 前後移動|轉太久會力竭,注意黃色體力條</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
