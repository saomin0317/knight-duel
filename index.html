<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knight Duel — 灰盒原型</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    .hpbar {
      position: fixed; top: 16px; width: 260px; height: 18px;
      background: #333; border: 2px solid #666; border-radius: 4px; overflow: hidden;
    }
    #hp-player { left: 16px; }
    #hp-enemy  { right: 16px; }
    .hpfill { height: 100%; width: 100%; transition: width .12s; }
    #hp-player .hpfill { background: #4a90d9; }
    #hp-enemy  .hpfill { background: #c0392b; }
    .hplabel { position: fixed; top: 38px; color: #aaa; font-size: 12px; }
    #label-player { left: 18px; }
    #label-enemy  { right: 18px; }
    #msg {
      position: fixed; top: 40%; left: 0; right: 0; text-align: center;
      color: #fff; font-size: 42px; font-weight: 700; text-shadow: 0 2px 8px #000;
      display: none; pointer-events: none;
    }
    #hint {
      position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
      color: #888; font-size: 13px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hp-player" class="hpbar"><div class="hpfill"></div></div>
  <div id="hp-enemy"  class="hpbar"><div class="hpfill"></div></div>
  <div id="label-player" class="hplabel">你(藍)</div>
  <div id="label-enemy"  class="hplabel">敵人(紅)</div>
  <div id="msg"></div>
  <div id="hint">← → 旋轉甩劍|↑ ↓ 前後移動|R 重開|N 換對手|場地:1 圓 2 方 3 六角 4 八角</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
